  <p class="eyebrow">Gate 6 · A special OR</p>
  <h2>XOR gate</h2>
  <p>XOR means “exclusive OR.” The lamp turns ON when the buttons are different: A or B, but not both together.</p>
  <p class="try-it"><strong>Try it:</strong> Press just one button. Matching button states make the lamp go dark.</p>
</section>
