  <p class="eyebrow">Gate 2 · Two inputs</p>
  <h2>AND gate</h2>
  <p>An AND gate is like two buttons in a row. The lamp turns ON only when button A <em>and</em> button B are both pressed.</p>
  <p class="try-it"><strong>Try it:</strong> Press both buttons. One button alone is not enough.</p>
