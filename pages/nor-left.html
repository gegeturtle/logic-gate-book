  <p class="eyebrow">Gate 5 · OR, flipped</p>
  <h2>NOR gate</h2>
  <p>NOR means “NOT OR.” The lamp turns ON only when both buttons are not pressed. Pressing either one turns it off.</p>
  <p class="try-it"><strong>Try it:</strong> Start with both buttons up. Press either one and watch the lamp.</p>
