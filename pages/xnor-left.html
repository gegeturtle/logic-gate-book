  <p class="eyebrow">Gate 7 · The matching gate</p>
  <h2>XNOR gate</h2>
  <p>XNOR is “NOT XOR.” The lamp turns ON when both buttons match: both up or both pressed. Different states turn it off.</p>
  <p class="try-it"><strong>Try it:</strong> Make the buttons match, then make them different.</p>
