  <p class="eyebrow">Gate 3 · Two inputs</p>
  <h2>OR gate</h2>
  <p>An OR gate turns the lamp ON when button A <em>or</em> button B is pressed. It also stays on when both are pressed.</p>
  <p class="try-it"><strong>Try it:</strong> Press either button. Then try pressing both.</p>
