  <p class="eyebrow">Gate 4 · AND, flipped</p>
  <h2>NAND gate</h2>
  <p>NAND means “NOT AND.” It is an AND gate with its answer flipped. The lamp is OFF only when both buttons are pressed.</p>
  <p class="try-it"><strong>Try it:</strong> Find the one button pattern that turns the lamp off.</p>
