  <p class="eyebrow">Gate 1 · One input</p>
  <h2>NOT gate</h2>
  <p>A NOT gate flips its input. When switch A is OFF, the lamp turns ON. When A is ON, the lamp turns OFF.</p>
  <p class="try-it"><strong>Try it:</strong> Press button A. The lamp always does the opposite.</p>
</section>
