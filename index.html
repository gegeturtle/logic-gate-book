<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e9e3d7">
    <title>A little book</title>
    <link rel="icon" id="site-favicon" href="assets/book-icon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #e9e3d7;
        color: #292820;
        --page-width: min(44vw, 58vh, 34rem);
        --page-height: calc(var(--page-width) * 1.4142);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 42%, #f8f5ed 0, #eee9df 48%, #e1dbcf 100%);
      }

      .stage {
        width: 100%;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 5vh 6vw;
        perspective: 1800px;
      }

      .book {
        position: relative;
        width: var(--page-width);
        height: var(--page-height);
        flex: none;
        filter: drop-shadow(0 24px 24px rgb(48 39 24 / 20%));
        transform-style: preserve-3d;
        transition: width 850ms cubic-bezier(.2,.75,.2,1);
      }

      .book.is-open { width: calc(var(--page-width) * 2); }

      .spread {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        opacity: 0;
        visibility: hidden;
        transition: opacity 350ms ease 250ms, visibility 0s linear 600ms;
      }

      .is-open .spread {
        opacity: 1;
        visibility: visible;
        transition: opacity 450ms ease 300ms;
      }

      .page {
        position: relative;
        min-width: 0;
        height: 100%;
        padding: 0;
        background: #fffdf7;
        border: 1px solid #e6e0d3;
        box-shadow: inset 0 0 22px rgb(97 78 44 / 4%);
        display: flex;
        flex-direction: column;
      }

      .spread.turn-next .page:last-child {
        z-index: 1;
        transform-origin: left center;
        animation: turn-next 650ms cubic-bezier(.2,.7,.25,1) both;
      }

      .spread.turn-previous .page:first-child {
        z-index: 1;
        transform-origin: right center;
        animation: turn-previous 650ms cubic-bezier(.2,.7,.25,1) both;
      }

      @keyframes turn-next {
        from { transform: rotateY(-72deg); filter: brightness(.78); }
        72% { transform: rotateY(5deg); filter: brightness(1); }
        to { transform: rotateY(0); filter: none; }
      }

      @keyframes turn-previous {
        from { transform: rotateY(72deg); filter: brightness(.78); }
        72% { transform: rotateY(-5deg); filter: brightness(1); }
        to { transform: rotateY(0); filter: none; }
      }

      .page:first-child {
        border-radius: 3px 0 0 3px;
        background: linear-gradient(90deg, #f5f1e8, #fffdf7 9%);
        box-shadow: inset -16px 0 20px -20px rgb(56 45 28 / 35%);
      }

      .page:last-child {
        border-radius: 0 3px 3px 0;
        background: linear-gradient(270deg, #f5f1e8, #fffdf7 9%);
        box-shadow: inset 16px 0 20px -20px rgb(56 45 28 / 35%);
      }

      .page-content {
        flex: 1;
        min-height: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        text-align: center;
        padding: clamp(1rem, 4.2vw, 3.25rem);
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #8a7650;
        font: 600 .68rem/1.3 system-ui, sans-serif;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: .55em; font-size: clamp(1.7rem, 4vw, 3.2rem); font-weight: 400; }
      h2 { margin-bottom: .55em; font-size: clamp(1.4rem, 3vw, 2.3rem); font-weight: 400; }
      .page-content p { max-width: 26ch; margin-bottom: 0; color: #656052; font-size: clamp(.95rem, 1.7vw, 1.15rem); line-height: 1.7; }

      .page-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .6rem;
        flex: 0 0 3.25rem;
        min-width: 0;
        padding: 0 clamp(1rem, 2.2vw, 1.75rem);
        color: #837e70;
        font: .72rem/1 system-ui, sans-serif;
        background: #eee9df;
        border-top: 1px solid #e2dccf;
      }

      .page-footer button {
        border: 0;
        padding: .55rem .3rem;
        color: #655637;
        background: transparent;
        font: inherit;
        cursor: pointer;
      }

      .page-footer button:hover:not(:disabled) { color: #241f16; text-decoration: underline; text-underline-offset: 3px; }
      .page-footer button:disabled { color: #bdb7aa; cursor: default; }
      button:focus-visible { outline: 2px solid #876d3e; outline-offset: 4px; border-radius: 2px; }

      .cover {
        position: absolute;
        z-index: 2;
        inset: 0 auto 0 50%;
        width: 100%;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #f6edda;
        text-align: center;
        cursor: pointer;
        border: 1px solid #765b32;
        border-radius: 3px 7px 7px 3px;
        background:
          linear-gradient(90deg, rgb(255 255 255 / 12%), transparent 13%, transparent 88%, rgb(0 0 0 / 16%)),
          #715a37;
        box-shadow: inset 5px 0 9px rgb(255 255 255 / 8%), inset -5px 0 10px rgb(0 0 0 / 12%);
        transform: translateX(-50%) rotateY(0);
        transform-origin: left center;
        backface-visibility: hidden;
        transition: left 850ms cubic-bezier(.2,.75,.2,1), width 850ms cubic-bezier(.2,.75,.2,1), transform 850ms cubic-bezier(.2,.75,.2,1), border-radius 850ms;
      }

      .cover::before {
        content: "";
        position: absolute;
        inset: 1rem;
        border: 1px solid rgb(238 219 177 / 45%);
        pointer-events: none;
      }

      .cover-copy { position: relative; display: grid; gap: .85rem; justify-items: center; }
      .cover-mark { width: 2rem; height: 2rem; object-fit: contain; }
      .cover-title { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 400; }
      .cover-subtitle { margin: 0; color: #d9ccb0; font: .68rem/1.4 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
      .cover-hint { position: absolute; bottom: 2.2rem; color: #e4d9c3; font: .74rem/1 system-ui, sans-serif; letter-spacing: .04em; }

      .is-open .cover {
        left: 0;
        width: 50%;
        border-radius: 3px 0 0 3px;
        transform: translateX(0) rotateY(-180deg);
        cursor: default;
        pointer-events: none;
      }

      @media (max-width: 600px) {
        :root { --page-width: min(44vw, 58vh); }
        .stage { padding-inline: 5vw; }
        .page-content { padding: clamp(.75rem, 4vw, 1.5rem); }
        .page-footer { flex-basis: 3rem; padding-inline: .75rem; }
        .eyebrow { letter-spacing: .12em; }
        .page-footer { font-size: .65rem; }
        .page-footer button { padding-inline: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="book" id="book" aria-label="Interactive book">
        <div class="spread" aria-live="polite">
          <article class="page" aria-label="Left page">
            <div class="page-content" id="left-content"></div>
            <footer class="page-footer">
              <button type="button" id="previous" aria-label="Previous page">← Previous</button>
              <span id="left-number"></span>
            </footer>
          </article>
          <article class="page" aria-label="Right page">
            <div class="page-content" id="right-content"></div>
            <footer class="page-footer">
              <span id="right-number"></span>
              <button type="button" id="next" aria-label="Next page">Next →</button>
            </footer>
          </article>
        </div>
        <button class="cover" id="cover" type="button" aria-label="Open the book">
          <span class="cover-copy">
            <img class="cover-mark" id="cover-icon" alt="">
            <span class="cover-title" id="cover-title">Loading book…</span>
            <span class="cover-subtitle" id="cover-subtitle"></span>
          </span>
          <span class="cover-hint">Click to open</span>
        </button>
      </section>
    </main>
    <script src="./book.js" defer></script>
  </body>
</html>
