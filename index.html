<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e6edf0">
    <title>A little book</title>
    <link rel="icon" id="site-favicon" href="assets/favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #e6edf0;
        color: #172a36;
        --page-width: min(44vw, 58vh, 34rem);
        --page-height: calc(var(--page-width) * 1.4142);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 42%, #f7fbfb 0, #e9f0f2 48%, #d8e2e7 100%);
      }

      .stage {
        width: 100%;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 5vh 6vw;
        perspective: 1800px;
      }

      .book {
        position: relative;
        width: var(--page-width);
        height: var(--page-height);
        flex: none;
        filter: drop-shadow(0 24px 24px rgb(48 39 24 / 20%));
        transform-style: preserve-3d;
        transition: width 850ms cubic-bezier(.2,.75,.2,1);
      }

      .book.is-open { width: calc(var(--page-width) * 2); }

      .spread {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        opacity: 0;
        visibility: hidden;
        transition: opacity 350ms ease 250ms, visibility 0s linear 600ms;
      }

      .is-open .spread {
        opacity: 1;
        visibility: visible;
        transition: opacity 450ms ease 300ms;
      }

      .page {
        position: relative;
        min-width: 0;
        height: 100%;
        padding: 0;
        background: #fffdf7;
        border: 1px solid #e6e0d3;
        box-shadow: inset 0 0 22px rgb(97 78 44 / 4%);
        display: flex;
        flex-direction: column;
      }

      .spread.turn-next .page:last-child {
        z-index: 1;
        transform-origin: left center;
        animation: turn-next 650ms cubic-bezier(.2,.7,.25,1) both;
      }

      .spread.turn-previous .page:first-child {
        z-index: 1;
        transform-origin: right center;
        animation: turn-previous 650ms cubic-bezier(.2,.7,.25,1) both;
      }

      @keyframes turn-next {
        from { transform: rotateY(-72deg); filter: brightness(.78); }
        72% { transform: rotateY(5deg); filter: brightness(1); }
        to { transform: rotateY(0); filter: none; }
      }

      @keyframes turn-previous {
        from { transform: rotateY(72deg); filter: brightness(.78); }
        72% { transform: rotateY(-5deg); filter: brightness(1); }
        to { transform: rotateY(0); filter: none; }
      }

      .page:first-child {
        border-radius: 3px 0 0 3px;
        background: linear-gradient(90deg, #f5f1e8, #fffdf7 9%);
        box-shadow: inset -16px 0 20px -20px rgb(56 45 28 / 35%);
      }

      .page:last-child {
        border-radius: 0 3px 3px 0;
        background: linear-gradient(270deg, #f5f1e8, #fffdf7 9%);
        box-shadow: inset 16px 0 20px -20px rgb(56 45 28 / 35%);
      }

      .page-content {
        flex: 1;
        min-height: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        text-align: center;
        padding: clamp(1rem, 4.2vw, 3.25rem);
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #8a7650;
        font: 600 .68rem/1.3 system-ui, sans-serif;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: .55em; font-size: clamp(1.7rem, 4vw, 3.2rem); font-weight: 400; }
      h2 { margin-bottom: .55em; font-size: clamp(1.4rem, 3vw, 2.3rem); font-weight: 400; }
      .page-content p { max-width: 26ch; margin-bottom: 0; color: #656052; font-size: clamp(.95rem, 1.7vw, 1.15rem); line-height: 1.7; }

      .lesson { width: 100%; max-width: 28rem; text-align: left; }
      .lesson .eyebrow { color: #087e8b; }
      .lesson h1, .lesson h2 { color: #17394a; }
      .lesson p { max-width: none; color: #455b65; font-size: clamp(.88rem, 1.35vw, 1rem); line-height: 1.6; }
      .lesson .try-it { margin-top: 1rem; padding: .75rem; border-left: 3px solid #f2ad3d; background: #f6f1df; color: #554522; font-size: .84rem; }

      .gate-demo { width: 100%; max-width: 24rem; display: grid; justify-items: center; gap: clamp(.4rem, 1vh, .75rem); padding: clamp(.65rem, 1.5vw, 1rem); border: 1px solid #cbdde1; border-radius: 1rem; background: linear-gradient(145deg, #f6fbfb, #eaf3f4); box-shadow: 0 8px 20px rgb(33 83 96 / 9%), inset 0 1px white; }
      .demo-heading { margin: 0; color: #245568; font: 700 .72rem/1.2 system-ui, sans-serif; letter-spacing: .1em; text-align: center; text-transform: uppercase; }
      .page-content .demo-heading { margin: 0; color: #245568; font: 700 .72rem/1.2 system-ui, sans-serif; }
      .circuit-svg { display: block; width: 100%; height: auto; overflow: visible; font-family: system-ui, sans-serif; }
      .circuit-svg .wire, .circuit-svg .gate-extra { fill: none; stroke: #20a399; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .circuit-svg .gate-shape { fill: #def2e9; stroke: #176d73; stroke-width: 3; stroke-linejoin: round; }
      .circuit-svg .gate-bubble { fill: #fffdf7; stroke: #176d73; stroke-width: 3; }
      .circuit-svg .gate-label { fill: #165366; font-size: 10px; font-weight: 800; text-anchor: middle; }
      .svg-input-button { cursor: pointer; outline: none; }
      .button-housing { fill: #b7d1d3; stroke: #55767e; stroke-width: 2; }
      .button-cap { fill: #f8ffff; stroke: #436b72; stroke-width: 2; filter: drop-shadow(0 2px 1px #365a5d55); transition: transform 120ms ease, fill 120ms ease; }
      .svg-input-button[aria-pressed="true"] .button-cap { fill: #ffd66e; transform: translateY(5px); }
      .svg-input-button:focus-visible .button-housing { stroke: #d58813; stroke-width: 4; }
      .button-label { fill: #274d58; font-size: 10px; font-weight: 800; text-anchor: middle; }
      .input-state { fill: #55747a; font-size: 8px; font-weight: 700; text-anchor: middle; }
      .svg-input-button[aria-pressed="true"] .input-state { fill: #087e68; }
      .lamp-glass { fill: #d5dfdd; stroke: #728b90; stroke-width: 3; transition: fill 180ms ease, filter 180ms ease; }
      .svg-lamp.is-on .lamp-glass { fill: #ffe889; stroke: #e4a813; filter: drop-shadow(0 0 8px #ffc928); }
      .lamp-filament { fill: none; stroke: #71898c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .svg-lamp.is-on .lamp-filament { stroke: #c27c00; }
      .lamp-text { fill: #52686c; font-size: 8px; font-weight: 800; letter-spacing: 1px; text-anchor: middle; }
      .demo-result { min-height: 1.2em; margin: 0; color: #587077; font: .72rem/1.3 system-ui, sans-serif; text-align: center; }
      .page-content .demo-result { margin: 0; color: #587077; font: .72rem/1.3 system-ui, sans-serif; }

      .page-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: .6rem;
        flex: 0 0 3.25rem;
        min-width: 0;
        padding: 0 clamp(1rem, 2.2vw, 1.75rem);
        color: #837e70;
        font: .72rem/1 system-ui, sans-serif;
        background: #eee9df;
        border-top: 1px solid #e2dccf;
      }

      .page-footer button {
        border: 0;
        padding: .55rem .3rem;
        color: #655637;
        background: transparent;
        font: inherit;
        cursor: pointer;
      }

      .page-footer button:hover:not(:disabled) { color: #241f16; text-decoration: underline; text-underline-offset: 3px; }
      .page-footer button:disabled { color: #bdb7aa; cursor: default; }
      button:focus-visible { outline: 2px solid #876d3e; outline-offset: 4px; border-radius: 2px; }

      .cover {
        position: absolute;
        z-index: 2;
        inset: 0 auto 0 50%;
        width: 100%;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #e7f8f5;
        text-align: center;
        cursor: pointer;
        border: 1px solid #176675;
        border-radius: 3px 7px 7px 3px;
        background:
          radial-gradient(circle at 50% 45%, rgb(39 203 192 / 12%), transparent 42%),
          linear-gradient(90deg, rgb(255 255 255 / 8%), transparent 13%, transparent 88%, rgb(0 0 0 / 18%)),
          #17394a;
        box-shadow: inset 5px 0 9px rgb(255 255 255 / 8%), inset -5px 0 10px rgb(0 0 0 / 12%);
        transform: translateX(-50%) rotateY(0);
        transform-origin: left center;
        backface-visibility: hidden;
        transition: left 850ms cubic-bezier(.2,.75,.2,1), width 850ms cubic-bezier(.2,.75,.2,1), transform 850ms cubic-bezier(.2,.75,.2,1), border-radius 850ms;
      }

      .cover::before {
        content: "";
        position: absolute;
        inset: 1rem;
        border: 1px solid rgb(85 212 207 / 36%);
        pointer-events: none;
      }

      .cover-copy { position: relative; display: grid; gap: .85rem; justify-items: center; }
      .cover-mark { width: 2rem; height: 2rem; object-fit: contain; }
      .cover-title { margin: 0; color: #f3fbf8; font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 700; }
      .cover-subtitle { margin: 0; color: #abd7d5; font: .68rem/1.4 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
      .cover-hint { position: absolute; bottom: 2.2rem; color: #c4e3e1; font: .74rem/1 system-ui, sans-serif; letter-spacing: .04em; }

      .is-open .cover {
        left: 0;
        width: 50%;
        border-radius: 3px 0 0 3px;
        transform: translateX(0) rotateY(-180deg);
        cursor: default;
        pointer-events: none;
      }

      @media (max-width: 600px) {
        :root { --page-width: min(44vw, 58vh); }
        .stage { padding-inline: 5vw; }
        .page-content { padding: clamp(.75rem, 4vw, 1.5rem); }
        .gate-demo { gap: .35rem; padding: .5rem .35rem; border-radius: .7rem; }
        .demo-heading { font-size: .62rem; }
        .lesson p { font-size: .82rem; }
        .lesson .try-it { padding: .55rem; font-size: .75rem; }
        .page-footer { flex-basis: 3rem; padding-inline: .75rem; }
        .eyebrow { letter-spacing: .12em; }
        .page-footer { font-size: .65rem; }
        .page-footer button { padding-inline: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="book" id="book" aria-label="Interactive book">
        <div class="spread" aria-live="polite">
          <article class="page" aria-label="Left page">
            <div class="page-content" id="left-content"></div>
            <footer class="page-footer">
              <button type="button" id="previous" aria-label="Previous page">← Previous</button>
              <span id="left-number"></span>
            </footer>
          </article>
          <article class="page" aria-label="Right page">
            <div class="page-content" id="right-content"></div>
            <footer class="page-footer">
              <span id="right-number"></span>
              <button type="button" id="next" aria-label="Next page">Next →</button>
            </footer>
          </article>
        </div>
        <button class="cover" id="cover" type="button" aria-label="Open the book">
          <span class="cover-copy">
            <img class="cover-mark" id="cover-icon" alt="">
            <span class="cover-title" id="cover-title">Loading book…</span>
            <span class="cover-subtitle" id="cover-subtitle"></span>
          </span>
          <span class="cover-hint">Click to open</span>
        </button>
      </section>
    </main>
    <script src="./book.js" defer></script>
  </body>
</html>
